name: Sebec

styleNames:
  light: Dawn
  dark: Dusk

_var:
  - &alpha0  "#000000 0%"
  - &alpha50 "#000000 50%"
  - &alpha75 "#000000 75%"

  - &badgeBackground cyan2
  - &badgeForeground { light: white5, dark: black0 }

  - &editorPopupBackground { light: white4, dark: black3 }
  - &editorPopupForeground { light: black5, dark: white0 }
  - &editorPopupBorder { light: white2, dark: black4 }
  - &editorPopupActiveBackground { light: cyan2 50%, dark: cyan0 50% }
  - &editorPopupActiveForeground { light: cyan1, dark: cyan2 }

  - &guideStroke         { light: cyan2 75%, dark: cyan0 75% }
  - &inactiveGuideStroke { light: cyan2 25%, dark: cyan0 25% }

  - &scrollbarSliderActiveBackground { light: cyan2 75%, dark: cyan1 75% }
  - &scrollbarSliderHoverBackground  { light: cyan2 75%, dark: cyan0 75% }

  - &sideBarBackground { light: white2, dark: black1 }
  - &sideBarForeground { light: black5, dark: white0 }
  - &sideBarBorder     { light: white1, dark: black4 }

  - &textLinkActiveForeground { light: cyan0, dark: cyan2 }

terminal:
  base:
    ansi:
      # Bright variants should be lighter than their counterparts in both modes
      black: black0
      blackBright: black5
      blue: blue1
      blueBright: blue2
      cyan: cyan1
      cyanBright: cyan2
      green: green1
      greenBright: green2
      red: red1
      redBright: red2
      magenta: purple1
      magentaBright: purple2
      white: white0
      whiteBright: white5
      yellow: yellow1
      yellowBright: yellow2

    background: &terminalBackground { light: white3, dark: black2 }
    foreground: &terminalForeground { light: black5, dark: white0 }

    selectionBackground: &activeMatchBackground { light: blue2, dark: blue0 }
    selectionForeground: { light: white5, dark: white0 }

    matchBackground: &matchBackground { light: white1, dark: black5 }

    cursorColor:     &cursorColor     { light: cyan2, dark: cyan1 }
    cursorTextColor: &cursorTextColor { light: white5, dark: black0 }

  iterm:
    badgeColor:       { light: white4, dark: black4 }
    boldColor:        { light: black2, dark: white4 }
    cursorGuideColor: { light: white4, dark: black4 }
    linkColor:        { light: cyan0,  dark: cyan1 }
    tabColor:         { light: white3, dark: black3 }
    underlineColor:   { light: black0, dark: white5 }

vscode:
  ### MARK: Tokens
  tokens:
    ### Semantic & textmate token color assignments.
    ###
    ### See:
    ###   https://macromates.com/manual/en/language_grammars#naming_conventions
    ###   https://code.visualstudio.com/api/language-extensions/semantic-highlight-guide
    ###   https://code.visualstudio.com/api/language-extensions/semantic-highlight-guide#semantic-token-scope-map

    ### MARK: Semantic tokens

    # Type hints and decorators — italic, foreground color
    - style: &tokenAnnotation { light: cyan1 italic, dark: cyan2 italic }
      semantic:
        - "*.typeHint"
        - decorator

    # Callables — all function and method calls, built-in or user-defined
    - style: &tokenCallable { light: cyan1, dark: cyan2 }
      semantic:
        - function
        - method
        - variable.builtin        # self, cls, this, super
        - type.defaultLibrary
        - class.defaultLibrary
        - function.defaultLibrary

    # Literal values — all embedded data
    - style: &tokenLiteral { light: purple1 italic, dark: purple2 italic }
      semantic:
        - string

    ### MARK: Textmate tokens

    # De-emphasized tokens
    #   * Keywords — all keywords unified: control flow, storage, modifiers
    #   * Operators and punctuation — de-emphasized
    - style: &tokenDeemphasized { light: blue2, dark: blue1 }
      textmate:
        - keyword
        - keyword.control
        - keyword.operator.logical  # and, or, not, in, is
        - keyword.operator.arithmetic
        - keyword.operator.assignment
        - keyword.operator.comparison
        - punctuation.parenthesis
        - punctuation.definition.arguments
        - punctuation.separator
        - punctuation.section.class.begin
        - punctuation.section.function.begin
        - storage.type
        - storage.type.class
        - storage.type.function
        - storage.modifier

    # Comments
    - style: &tokenComment { light: green2 italic, dark: green0 italic }
      textmate:
        - comment
        - punctuation.definition.comment

    # Literal values — strings, numbers, language constants
    - style: *tokenLiteral
      textmate:
        - string
        - constant.numeric
        - constant.language         # None, True, False, null, nil, undefined




    # Callables — functions and methods (textmate fallback)
    - style: *tokenCallable
      textmate:
        - entity.name.function
        - support.function
        - variable.language         # self, this, super
        - support.type.primitive    # type hint fallback: int, str, bool


    # Decorators — italic
    - style: *tokenAnnotation
      textmate:
        - entity.name.function.decorator

    ### -----------------------------------------------------------------------
    ### [HTML/Svelte]
    - style: *tokenDeemphasized
      textmate:
        - entity.name.tag.html
        - entity.name.tag.svelte

    - style: *tokenAnnotation
      textmate:
        - entity.other.attribute-name.html
        - entity.other.attribute-name.svelte

    - style: *tokenDeemphasized
      textmate:
        - punctuation.definition.tag.begin.html
        - punctuation.definition.tag.begin.svelte
        - punctuation.definition.tag.end.html
        - punctuation.definition.tag.end.svelte

    ### -----------------------------------------------------------------------
    ### [JSON/YAML]
    - style: *tokenAnnotation
      textmate:
        - support.type.property-name.json
        - entity.name.tag.yaml

  ### MARK: UI
  ui:

    foreground:           { light: black4, dark: white0 }
    disabledForeground:   { light: white0, dark: black5 }
    sash.hoverBorder:     { light: cyan2,  dark: cyan1  }
    selection.background: { light: white0, dark: black4 }
    widget.shadow:        { light: white1, dark: black0 }

    focusBorder:     &focusBorder     cyan2
    errorForeground: &errorForeground { light: red1, dark: red2 }

    ### Action colors
    editorActionList:
      background: *editorPopupBackground
      foreground: *editorPopupForeground
      focusForeground: *editorPopupActiveForeground
      focusBackground: *editorPopupActiveBackground

    toolbar:
      activeBackground: { light: white0, dark: black5 }
      hoverBackground:  { light: white1, dark: black4 }

    ### Activity bar
    activityBar:
      background:       &activityBarBackground { light: white1, dark: black0 }
      foreground:       &activityBarForeground { light: cyan2,  dark: cyan1 }
      activeBorder:     *activityBarForeground
      border:           { light: white0, dark: black3 }
      dropBorder:       { light: cyan2,  dark: cyan0 }
      inactiveForeground: { light: white0, dark: black5 }

    activityBarBadge:
      background: *badgeBackground
      foreground: *badgeForeground

    activityErrorBadge:
      background: red2
      foreground: *badgeForeground

    activityWarningBadge:
      background: yellow2
      foreground: *badgeForeground

    ### Badge
    badge:
      background: *badgeBackground
      foreground: *badgeForeground

    ### Button
    button:
      background:      &buttonBackground      { light: cyan2, dark: cyan0 }
      hoverBackground: &buttonHoverBackground { light: cyan1, dark: cyan1 }
      foreground:      &buttonForeground      { light: white5, dark: white3 }
      secondaryBackground:      { light: white0, dark: black4 }
      secondaryHoverBackground: { light: white0, dark: black5 }

    ### Dropdown / input background
    dropdown:
      background:     &inputBackground { light: white2, dark: black0 }
      listBackground: *inputBackground

    ### Editor
    editor:
      background: &editorBackground { light: white3, dark: black2 }
      foreground: *terminalForeground

      selectionBackground: &editorSelectionBackground { light: blue2 50%, dark: blue0 50% }

      findMatchBackground:          *editorSelectionBackground
      findMatchHighlightBackground: &editorInactiveMatchBackground { light: white0 50%, dark: black5 50% }

      wordHighlightBackground:       { light: white0 35%, dark: black5 35% }
      wordHighlightStrongBackground: { light: white0 50%, dark: black5 50% }

      selectionHighlightBackground: *editorInactiveMatchBackground
      hoverHighlightBackground:     { light: white0 50%, dark: black5 50% }
      lineHighlightBackground:      { light: white2, dark: black2 }

      foldBackground: { light: blue2 25%, dark: blue0 25% }

    editorBracketMatch:
      background: { light: purple2 50%, dark: purple1 50% }
      border: *alpha0

    editorBracketHighlight:
      unexpectedBracket.foreground: { light: red1,    dark: red1 }
      foreground1: { light: blue2,   dark: blue1 }
      foreground2: { light: purple2, dark: purple1 }
      foreground3: { light: cyan2,   dark: cyan1 }
      foreground4: { light: yellow2, dark: yellow1 }
      foreground5: { light: green2,  dark: green1 }
      foreground6: { light: white0,  dark: black5 }

    editorCursor:
      background: *cursorTextColor
      foreground: *cursorColor

    editorError:
      foreground: red1

    editorGutter:
      addedBackground:    { light: green2 75%,  dark: green0 75% }
      deletedBackground:  { light: red2 75%,    dark: red1 75% }
      modifiedBackground: { light: yellow2 75%, dark: yellow1 75% }
      foldingControlForeground: { light: blue1, dark: blue2 }

    editorHoverWidget:
      background: *editorPopupBackground
      foreground: *editorPopupForeground
      border:     *editorPopupBorder

    editorInlayHint:
      background: *alpha0
      foreground: { light: yellow2, dark: yellow0 }

    editorIndentGuide:
      background: *inactiveGuideStroke
      activeBackground: *guideStroke

    editorLineNumber:
      foreground:       { light: white0, dark: black5 }
      activeForeground: { light: cyan0,  dark: cyan1 }

    editorLink:
      activeForeground: *textLinkActiveForeground

    editorOverviewRuler:
      border: *alpha0

    editorRuler.foreground: { light: blue2 25%, dark: blue0 25% }

    editorWarning:
      foreground: yellow0

    editorWhitespace:
      foreground: { light: white0, dark: black4 }

    ### Editor groups & tabs
    editorGroup:
      border: *sideBarBorder
      dropBackground: { light: cyan2 25%, dark: cyan1 25% }

    editorGroupHeader:
      tabsBackground: { light: white1, dark: black1 }

    tab:
      activeBackground:   { light: white3, dark: black2 }
      activeForeground:   { light: cyan1,  dark: cyan2 }
      hoverBackground:    { light: white3, dark: black1 }
      inactiveBackground: { light: white2, dark: black1 }
      inactiveForeground: { light: white0, dark: black5 }
      selectedBorderTop:  { light: cyan2,  dark: cyan1 }
      border: *alpha0
      dragAndDropBorder: cyan2
      lastPinnedBorder: *alpha0

    ### Editor widgets
    editorWidget:
      background: { light: white5, dark: black4 }
      foreground: { light: black4, dark: white2 }
      border: { light: cyan2, dark: cyan1 }

    editorSuggestWidget:
      selectedBackground: *editorPopupActiveBackground
      selectedForeground: *editorPopupForeground
      highlightForeground:      { light: cyan2, dark: cyan1 }
      focusHighlightForeground: *editorPopupActiveForeground

    ### Input
    input:
      background:            *inputBackground
      foreground:            { light: black5, dark: white3 }
      placeholderForeground: { light: white0, dark: black5 }
      border:                { light: white0, dark: black5 }

    inputOption:
      activeBackground: *buttonBackground
      activeForeground: *buttonForeground
      activeBorder: *inputBackground
      hoverBackground: { light: white0, dark: black4 }

    inputValidation:
      errorBackground: &errorBackground { light: red2,   dark: red1 }
      errorForeground:                  { light: white5, dark: white4 }
      errorBorder:     *errorBackground

      infoBackground: &infoBackground { light: cyan2,  dark: cyan1 }
      infoForeground:                 { light: white5, dark: white4 }
      infoBorder:     *infoBackground

      warningBackground: &warningBackground { light: yellow1, dark: yellow0 }
      warningForeground:                    { light: black4,  dark: white4 }
      warningBorder:     *warningBackground

    ### Keybinding labels
    keybindingLabel:
      background:   *alpha0
      foreground:   { light: black5, dark: white0 }
      border:       { light: white0, dark: black5 }
      bottomBorder: { light: white0, dark: black5 }

    ### Lists and trees
    list:
      activeSelectionBackground:       &listActiveBackground { light: cyan2,  dark: cyan0 }
      activeSelectionForeground:       &listActiveForeground { light: black4, dark: white4 }
      activeSelectionIconForeground:   *listActiveForeground
      inactiveSelectionBackground:     *listActiveBackground
      inactiveSelectionForeground:     *listActiveForeground
      inactiveSelectionIconForeground: *listActiveForeground

      hoverBackground: &listHoverBackground { light: white2, dark: black4 }
      hoverForeground: &listHoverForeground { light: black3, dark: white2 }
      focusBackground: *listHoverBackground
      focusForeground: *listHoverForeground
      focusOutline:    *alpha0

      dropBackground:        { light: cyan2 25%, dark: cyan1 25% }
      filterMatchBackground: *matchBackground

      errorForeground:   *errorForeground
      warningForeground: { light: yellow2, dark: yellow1 }

    tree:
      indentGuidesStroke:         *guideStroke
      inactiveIndentGuidesStroke: *inactiveGuideStroke

    ### Minimap
    minimap:
      background:        { light: white2 50%, dark: black0 50% }
      foregroundOpacity: *alpha50
      errorHighlight:     { light: red0 50%,    dark: red1 50% }
      warningHighlight:   { light: yellow1 50%, dark: yellow1 50% }
      findMatchHighlight: { light: blue2 50%,   dark: white1 50% }
      selectionHighlight: { light: blue2 50%,   dark: white0 50% }

    minimapGutter:
      addedBackground:    green1 50%
      deletedBackground:  red1 50%
      modifiedBackground: yellow1 50%

    minimapSlider:
      background:       { light: white2 50%, dark: black4 50% }
      activeBackground: *scrollbarSliderActiveBackground
      hoverBackground:  *scrollbarSliderHoverBackground

    ### Panel
    panel:
      background:
        <<: *terminalBackground
      border:
        light: white2
        dark: black3

    ### Progress bar
    progressBar:
      background: cyan2

    ### Quick picker
    pickerGroup:
      foreground: &pickerGroupDim { light: white2, dark: black5 }
      border:     *pickerGroupDim

    ### Scrollbar
    scrollbar:
      shadow: { light: cyan2 50%, dark: cyan0 50% }

    scrollbarSlider:
      background:       { light: white0 75%, dark: black5 75% }
      activeBackground: *scrollbarSliderActiveBackground
      hoverBackground:  *scrollbarSliderHoverBackground

    ### Sidebar
    sideBar:
      background: *sideBarBackground
      foreground: *sideBarForeground
      border:     *sideBarBorder
      dropBackground: { light: cyan2 25%, dark: cyan1 25% }

    sideBarSectionHeader:
      border: { light: white0, dark: black5 }

    ### Status bar
    statusBar:
      background: { light: cyan2, dark: cyan0 }
      foreground: { light: cyan0, dark: cyan2 }

    statusBarItem:
      activeBackground: { light: cyan2, dark: cyan2 }
      hoverBackground:  { light: cyan2, dark: cyan1 }
      prominentBackground:      { light: cyan2 50%, dark: cyan1 50% }
      prominentHoverBackground: { light: cyan2,     dark: cyan1 }
      remoteBackground:      { light: cyan2, dark: cyan0 }
      remoteHoverBackground: { light: cyan2, dark: cyan1 }
      hoverForeground:       { light: white5, dark: white2 }
      remoteForeground:      { light: cyan0,  dark: cyan2 }
      remoteHoverForeground: { light: white5, dark: white2 }
      errorBackground: red0
      errorForeground: red2
      warningBackground: yellow0
      warningForeground: yellow2

    ### Text
    textLink:
      foreground:       cyan1
      activeForeground: *textLinkActiveForeground

    ### Title bar
    titleBar:
      activeBackground:   { light: white1, dark: black0 }
      inactiveBackground: { light: white1, dark: black0 }
      activeForeground:   { light: black5, dark: white0 }
      inactiveForeground: { light: white0, dark: black5 }

    ### Window border
    window:
      activeBorder:   &windowBorder { light: white5, dark: black0 }
      inactiveBorder: *windowBorder
