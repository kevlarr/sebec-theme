name: Sebec

styleNames:
  light: Dawn
  dark: Dusk

# The design system tokens
#
# These are not meant to comprehensively cover every feature for any application, like
# "badge colors" that are only used in VS Code; they are meant to codify the design decisions
# shared between apps. Additionally, these should not include any alpha levels - they should be
# entirely opaque, as transparency is application-dependent.
system:
    # The base background & foreground colors
    - &backgroundLow   { light: white2, dark: black1 }
    - &background      { light: white3, dark: black2 }
    - &backgroundHigh  { light: white4, dark: black3 }

    - &foreground         { light: black5, dark: white0 }
    - &foregroundDim      { light: gray3, dark: gray3 }
    - &foregroundDisabled { light: white0, dark: black5 }
    - &foregroundAccent   { light: blue2,  dark: blue2 }

    # These foreground colors are for inline messages; the corresponding alerts use light text
    # on the various background colors
    - &foregroundError   { light: red1, dark: red2 }
    - &foregroundWarning { light: yellow0, dark: yellow1 }

    # Alert background & foreground colors
    - &alertBackgroundError   { light: red2,   dark: red0 }
    - &alertBackgroundInfo    { light: blue3,  dark: blue2 }
    - &alertBackgroundWarning { light: yellow1, dark: yellow0 }

    - &alertForegroundError   { light: white5, dark: white4 }
    - &alertForegroundInfo    { light: white5, dark: white4 }
    - &alertForegroundWarning { light: black4,  dark: white4 }

    # Terminal cursor
    - &cursorColor { light: blue4, dark: blue2 } # The intended color for line or box cursors
    - &cursorTextForeground { light: white5, dark: black0 } # The intended text color for box cursors
    - &cursorGuideColor { light: white2, dark: black3 } # Should be one stop away from the background

    # Git modifiers
    - &gitAdded    { light: green2,  dark: green0 }
    - &gitDeleted  { light: red2,    dark: red0 }
    - &gitModified { light: yellow2, dark: yellow1 }

    # Hyperlinks
    - &linkColor { light: cyan0,  dark: cyan1 }
    - &linkColorActive { light: cyan1, dark: cyan2 }

    # Text selection
    - &selectionBackground { light: blue5, dark: blue0 }
    - &selectionForeground { light: black5, dark: white0 }

    # Match backgrounds
    #
    # The "active" match background should be slightly more prevalent than text selection
    # backgrounds, in case they are able to be displayed at the same time.
    #
    # The "inactive" match background should use a gray that's noticeable against the background
    # color without being as attention-grabbing as the blue selection background color that is
    # used as the "active" match background.
    - &matchBackgroundActive { light: blue4, dark: blue1 }
    - &matchBackgroundInactive { light: white1, dark: black5 }

    # { light: black4, dark: white4 }
    - &matchForegroundActive { light: white5, dark: white2 }

terminal:
  base:
    ansi:
      # Bright variants should be lighter than their counterparts in both modes
      # TODO: Verify colors on light mode
      # FIXME: Understand how black/white work in both modes and figure out if they need to be
      # swapped out for a gray depending on the mode
      black: black0
      blackBright: black5
      blue: blue2
      blueBright: blue3
      cyan: { light: cyan0, dark: cyan1 }
      cyanBright: { light: cyan1, dark: cyan2 }
      green: green1
      greenBright: green2
      red: red1
      redBright: red2
      magenta: purple1
      magentaBright: purple2
      white: white0
      whiteBright: white5
      yellow: yellow1
      yellowBright: yellow2

    foreground: *foreground
    background: *background
    selectionForeground: *selectionForeground
    selectionBackground: *selectionBackground

    matchBackground: *matchBackgroundInactive

    # iTerm2 will ignore cursor color for box cursors if "Smart box cursor color" is selected
    cursorColor: *cursorColor
    cursorTextColor: *cursorTextForeground

  iterm:
    badgeColor:       { light: white4, dark: black4 } # TODO
    boldColor:        { light: black2, dark: white4 } # TODO
    cursorGuideColor: *cursorGuideColor
    linkColor:        *linkColor
    tabColor:         { light: white3, dark: black3 }
    underlineColor:   { light: black0, dark: white5 } # TODO

vscode:
  var:
    - &alpha0  "#000000 0%"
    - &alpha50 "#000000 50%"
    - &alpha75 "#000000 75%"

    - &backgroundActive { light: blue3 50%, dark: blue1 }

    - &badgeBackground blue3
    - &badgeForeground { light: white5, dark: black0 }

    - &border    { light: white1, dark: black4 }
    - &borderDim { light: white2, dark: black3 }
    - &borderActive    { light: blue3,  dark: blue2 } # *foregroundAccent
    - &borderActiveDim { light: blue4,  dark: blue1 }

    - &buttonBackground      { light: blue3, dark: blue1 }
    - &buttonBackgroundHover { light: blue2, dark: blue2 }
    - &buttonForeground { light: white5, dark: white3 }

    - &guideStroke         { light: blue5, dark: blue0  }
    - &inactiveGuideStroke { light: white1, dark: black5 }

    - &inputBackground { light: white2, dark: black1 }

    - &scrollbarSliderActiveBackground { light: blue3 75%, dark: blue2 75% }
    - &scrollbarSliderHoverBackground  { light: blue3 75%, dark: blue1 75% }

  ### MARK: Tokens
  tokens:
    ### Semantic & textmate token color assignments.
    ###
    ### See:
    ###   https://macromates.com/manual/en/language_grammars#naming_conventions
    ###   https://code.visualstudio.com/api/language-extensions/semantic-highlight-guide
    ###   https://code.visualstudio.com/api/language-extensions/semantic-highlight-guide#semantic-token-scope-map

    ### MARK: Semantic tokens

    # Declarations — bold signals "this is where the thing is defined"
    - style: &tokenDeclaration { light: cyan0 bold, dark: cyan2 bold }
      semantic:
        - function.declaration
        - method.declaration
        - class.declaration
        - enum.declaration
        - interface.declaration
        - struct.declaration

    # Parameters — explicitly foreground to prevent bleed from keyword/punctuation rules
    - style: &tokenForeground { light: black5, dark: white0 }
      semantic:
        - parameter
      textmate:
        - variable.parameter

    # Types — purely type-system constructs (interfaces, abstract types, type parameters)
    - style: &tokenType { light: purple1, dark: purple2 }
      semantic:
        - type
        - interface
        - struct
        - enum
        - typeParameter
        - type.defaultLibrary

    # Decorators and type annotations — italic purple: not executable code
    # class.typeHint is explicit because VS Code gives exact-type rules precedence over
    # wildcard-modifier rules (*.typeHint) for color; explicit beats both
    - style: &tokenAnnotation { light: purple1 italic, dark: purple2 italic }
      semantic:
        - decorator
        - "*.typeHint"
        - class.typeHint
        - class.decorator
        - "function.typeHint"
        - "function.decorator"

    # Callables — things that do: functions, methods, and classes (callable objects)
    - style: &tokenCallable { light: cyan0, dark: cyan1 }
      semantic:
        - function
        - method
        - class               # classes are callable objects; *.typeHint overrides in annotation positions
        - class.defaultLibrary
        - variable.builtin    # self, cls, this, super
        - function.defaultLibrary

    # Literal values — all embedded data
    - style: &tokenLiteral { light: green0, dark: green1 }
      semantic:
        - string

    ### MARK: Textmate tokens

    # De-emphasized tokens
    - style: &tokenDeemphasized { light: gray4, dark: gray3 }
      textmate:
        # Keywords — all keywords unified: control flow, storage, modifiers
        - keyword
        - keyword.control
        - keyword.operator.logical  # and, or, not, in, is
        - keyword.operator.arithmetic
        - keyword.operator.assignment
        - keyword.operator.comparison
        # Operators and punctuation — de-emphasized
        - punctuation.parenthesis
        - punctuation.definition.arguments
        - punctuation.separator
        - punctuation.section.class.begin
        - punctuation.section.function.begin
        # Keywords eg. `def` and `class`
        - storage.type
        - storage.type.class
        - storage.type.function
        - storage.modifier

    # Comments
    - style: &tokenComment { light: blue3 italic, dark: blue1 italic }
      textmate:
        - comment
        - punctuation.definition.comment

    # Literal values — strings, numbers, language constants
    - style: *tokenLiteral
      textmate:
        - string
        - constant.numeric
        - constant.language  # None, True, False, null, nil, undefined




    # Types — textmate fallback (purely type-system constructs)
    - style: *tokenType
      textmate:
        - entity.name.type
        - support.type

    # Callables — textmate fallback (classes are callable objects)
    - style: *tokenCallable
      textmate:
        - entity.name.function
        - entity.name.class
        - support.function
        - support.class
        - support.type.primitive  # int, str, bool — callable builtins
        - variable.language       # self, this, super

    # Decorators — italic purple, including the @ symbol
    - style: *tokenAnnotation
      textmate:
        - entity.name.function.decorator
        - punctuation.decorator             # @ in TypeScript/JavaScript
        - punctuation.definition.decorator  # @ in Python

    ### -----------------------------------------------------------------------
    ### [HTML/Svelte]
    # Tag names are type/class identifiers — more prominent than attributes
    - style: *tokenCallable
      textmate:
        - entity.name.tag.html
        - entity.name.tag.svelte

    # Attribute names and punctuation recede like structural labels
    - style: *tokenDeemphasized
      textmate:
        - entity.other.attribute-name.html
        - entity.other.attribute-name.svelte
        - punctuation.definition.tag.begin.html
        - punctuation.definition.tag.begin.svelte
        - punctuation.definition.tag.end.html
        - punctuation.definition.tag.end.svelte

    ### -----------------------------------------------------------------------
    ### [JSON]
    - style: *tokenDeemphasized
      textmate:
        - support.type.property-name.json

    ### -----------------------------------------------------------------------
    ### [YAML]
    - style: *tokenForeground
      textmate:
        - entity.name.tag.yaml

    # The anchor definition
    - style: *tokenDeclaration
      textmate:
        - variable.other.anchor.yaml

    # The anchor reference
    - style: *tokenCallable
      textmate:
        - variable.other.alias.yaml

  ### MARK: UI
  ui:

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Base colors
    ### https://code.visualstudio.com/api/references/theme-color#base-colors
    foreground:           *foreground
    disabledForeground:   *foregroundDisabled
    sash.hoverBorder:     *borderActiveDim
    selection.background: *selectionBackground # Eg. selecting text in a search widget
    # widget.shadow:        { light: blue4, dark: blue2 }

    focusBorder: *borderActive
    errorForeground: *foregroundError

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Action colors
    ### https://code.visualstudio.com/api/references/theme-color#action-colors
    editorActionList:
      background: *backgroundHigh
      foreground: *foreground
      # focusForeground: *editorPopupActiveForeground # TODO
      focusBackground: *backgroundActive

    toolbar:
      activeBackground: *buttonBackground
      hoverBackground:  *buttonBackgroundHover

    ### -----------------------------------------------------------------------
    ### MARK: Action bar colors
    ### https://code.visualstudio.com/api/references/theme-color#action-bar-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Activity bar
    ### https://code.visualstudio.com/api/references/theme-color#activity-bar
    ###
    ### Unstyled:
    ###  - activityBar.activeBackground
    ###  - activityBar.activeFocusBorder
    ###  - activityBarTop.*
    activityBar:
      background:       &activityBarBackground { light: white1, dark: black0 }
      foreground:       *foregroundAccent
      activeBorder:     *borderActive
      border:           *borderDim
      dropBorder:       *borderActiveDim
      inactiveForeground: *foregroundDim

    activityBarBadge:
      background: *badgeBackground
      foreground: *badgeForeground

    activityErrorBadge:
      background: red2
      foreground: *badgeForeground

    activityWarningBadge:
      background: yellow2
      foreground: *badgeForeground

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Badge
    ### https://code.visualstudio.com/api/references/theme-color#badge
    badge:
      background: *badgeBackground
      foreground: *badgeForeground

    ### -----------------------------------------------------------------------
    ### MARK: Banner colors
    ### https://code.visualstudio.com/api/references/theme-color#banner-colors

    ### -----------------------------------------------------------------------
    ### MARK: Breadcrumbs colors
    ### https://code.visualstudio.com/api/references/theme-color#breadcrumbs-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Button control
    ### https://code.visualstudio.com/api/references/theme-color#button-control
    ###
    ### Unstyled:
    ###  - button.border
    ###  - button.separator
    ###  - checkbox.*
    ###  - radio.*
    button:
      background:      *buttonBackground
      hoverBackground: *buttonBackgroundHover
      foreground:      *buttonForeground
      secondaryBackground:      { light: white2, dark: gray0 }
      secondaryHoverBackground: { light: white1, dark: gray1 }

    ### -----------------------------------------------------------------------
    ### MARK: Chart colors
    ### https://code.visualstudio.com/api/references/theme-color#chart-colors

    ### -----------------------------------------------------------------------
    ### MARK: Chat colors
    ### https://code.visualstudio.com/api/references/theme-color#chat-colors

    ### -----------------------------------------------------------------------
    ### MARK: Command center colors
    ### https://code.visualstudio.com/api/references/theme-color#command-center-colors

    ### -----------------------------------------------------------------------
    ### MARK: Comments view colors
    ### https://code.visualstudio.com/api/references/theme-color#comments-view-colors

    ### -----------------------------------------------------------------------
    ### MARK: Debug colors
    ### https://code.visualstudio.com/api/references/theme-color#debug-colors

    ### -----------------------------------------------------------------------
    ### MARK: Debug icons colors
    ### https://code.visualstudio.com/api/references/theme-color#debug-icons-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Dropdown control
    ### https://code.visualstudio.com/api/references/theme-color#dropdown-control
    ###
    ### Unstyled:
    ###  - dropdown.border
    ###  - dropdown.foreground
    dropdown:
      background: *inputBackground
      listBackground: *inputBackground

    ### -----------------------------------------------------------------------
    ### MARK: Editor colors
    ### https://code.visualstudio.com/api/references/theme-color#editor-colors
    editor:
      background: *background
      foreground: *foreground

      findMatchBackground:  *matchBackgroundActive
      findMatchHighlightBackground: *matchBackgroundInactive

      # TODO
      foldBackground: { light: blue5 35%, dark: blue0 35% }
      # hoverHighlightBackground:     { light: white0 50%, dark: black5 50% }
      # lineHighlightBackground: *cursorGuideColor
      selectionBackground: *selectionBackground
      selectionHighlightBackground: *selectionBackground
      wordHighlightBackground:       { light: white0 35%, dark: black3 }
      # wordHighlightStrongBackground: { light: white0 50%, dark: black5 50% }

    editorBracketMatch:
      # background: { light: blue3 50%, dark: blue1 50% }
      border: *borderActive

    editorBracketHighlight:
      unexpectedBracket.foreground: { light: red1,    dark: red1 }
      foreground1: { light: blue3,   dark: blue2 }
      foreground2: { light: purple2, dark: purple1 }
      foreground3: { light: cyan2,   dark: cyan1 }  # bracket pairs are code tokens, keep cyan
      foreground4: { light: yellow2, dark: yellow1 }
      foreground5: { light: green2,  dark: green1 }
      foreground6: { light: white0,  dark: black5 }

    editorCursor:
      background: *cursorTextForeground
      foreground: *cursorColor

    editorError:
      foreground: *foregroundError

    editorGutter:
      addedBackground: *gitAdded
      deletedBackground: *gitDeleted
      modifiedBackground: *gitModified
      foldingControlForeground: *borderActive

    editorHoverWidget:
      background: *backgroundHigh
      foreground: *foreground
      border:     *border

    editorInlayHint:
      background: *alpha0
      foreground: { light: purple2, dark: purple0 } # Purple for syntax inlay

    editorIndentGuide:
      background: *inactiveGuideStroke
      activeBackground: *guideStroke

    editorLineNumber:
      foreground: *foregroundDisabled
      activeForeground: *borderActive

    editorLink:
      activeForeground: *linkColorActive

    editorOverviewRuler:
      border: *alpha0

    # editorRuler.foreground: { light: blue3 25%, dark: blue1 25% }

    editorWarning:
      foreground: *foregroundWarning

    # editorWhitespace:
    #   foreground: { light: white0, dark: black4 }

    ### -----------------------------------------------------------------------
    ### MARK: Diff editor colors
    ### https://code.visualstudio.com/api/references/theme-color#diff-editor-colors
    diffEditor:
      insertedTextBackground: { light: green1 20%, dark: green0 20% }
      removedTextBackground:  { light: red1 20%,   dark: red0 20% }

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Editor groups & tabs
    ### https://code.visualstudio.com/api/references/theme-color#editor-groups-tabs
    ###
    ### Unstyled:
    ###  - sideBySideEditor.*
    editorGroup:
      border: *border
      dropBackground: *borderActiveDim

    editorGroupHeader:
      tabsBackground: *backgroundLow

    tab:
      activeBackground:   *background
      activeForeground:   *foregroundAccent
      # hoverBackground:    { light: white3, dark: black1 } # TODO wasn't working
      inactiveBackground: *backgroundLow
      inactiveForeground: *foregroundDim
      activeBorderTop:    *borderActive
      selectedBorderTop:  *borderActiveDim
      border: *alpha0
      dragAndDropBorder: *borderActiveDim
      lastPinnedBorder: *alpha0

    ### -----------------------------------------------------------------------
    ### MARK: Editor widget colors
    ### https://code.visualstudio.com/api/references/theme-color#editor-widget-colors
    editorWidget:
      background: *backgroundHigh
      foreground: *foreground
      border: *borderActive

    editorSuggestWidget:
      selectedBackground: *backgroundActive
      selectedForeground: *foreground
      # TODO
      # highlightForeground:      { light: blue3, dark: blue2 }
      # focusHighlightForeground: *editorPopupActiveForeground

    ### -----------------------------------------------------------------------
    ### MARK: Extensions colors
    ### https://code.visualstudio.com/api/references/theme-color#extensions-colors

    ### -----------------------------------------------------------------------
    ### MARK: Gauge colors
    ### https://code.visualstudio.com/api/references/theme-color#gauge-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Input control
    ### https://code.visualstudio.com/api/references/theme-color#input-control
    input:
      background:            *inputBackground
      foreground:            *foreground
      placeholderForeground: *foregroundDisabled
      border:                *border

    inputOption:
      activeBackground: *buttonBackground
      activeForeground: *buttonForeground
      activeBorder:     *inputBackground
      hoverBackground:  *buttonBackgroundHover

    inputValidation:
      errorBackground: *alertBackgroundError
      errorForeground: *alertForegroundError
      errorBorder:     *alertBackgroundError

      infoBackground: *alertBackgroundInfo
      infoForeground: *alertForegroundInfo
      infoBorder:     *alertBackgroundInfo

      warningBackground: *alertBackgroundWarning
      warningForeground: *alertForegroundWarning
      warningBorder:     *alertBackgroundWarning

    ### -----------------------------------------------------------------------
    ### MARK: Integrated terminal colors
    ### https://code.visualstudio.com/api/references/theme-color#integrated-terminal-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Keybinding label colors
    ### https://code.visualstudio.com/api/references/theme-color#keybinding-label-colors
    keybindingLabel:
      background:   *backgroundLow
      foreground:   *foreground
      border:       *border
      bottomBorder: *border

    ### -----------------------------------------------------------------------
    ### MARK: Keyboard shortcut table colors
    ### https://code.visualstudio.com/api/references/theme-color#keyboard-shortcut-table-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Lists and trees
    ###
    ### Colors for list and trees like the File Explorer. An active list/tree has keyboard
    ### focus, an inactive does not.
    ###
    ### https://code.visualstudio.com/api/references/theme-color#lists-and-trees
    ###
    ### Unstyled:
    ###  - list.focusHighlightForeground
    ###  - list.focusAndSelectionOutline
    ###  - list.highlightForeground
    ###  - listFilterWidget.*
    ###  - tree.tableOddRowsBackground
    list:
      activeSelectionBackground:       *matchBackgroundActive
      activeSelectionForeground:       *matchForegroundActive
      activeSelectionIconForeground:   *matchForegroundActive
      # Keep the "inactive" highlighted with the accent color
      inactiveSelectionBackground:     *matchBackgroundActive
      inactiveSelectionForeground:     *matchForegroundActive
      inactiveSelectionIconForeground: *matchForegroundActive

      # Focus shows when navigating with keyboard or when clicking, but not when a different
      # window is focused - only the "inactiveSelection" shows.
      # focusBackground: *matchBackgroundInactive
      # focusForeground: *listHoverForeground
      focusOutline: *borderActive
      hoverBackground: *matchBackgroundInactive

      dropBackground: *selectionBackground
      filterMatchBackground: *matchBackgroundActive

      errorForeground: *foregroundError
      warningForeground: *foregroundWarning

    tree:
      indentGuidesStroke: *guideStroke
      inactiveIndentGuidesStroke: *inactiveGuideStroke

    ### -----------------------------------------------------------------------
    ### MARK: Merge conflict colors
    ### https://code.visualstudio.com/api/references/theme-color#merge-conflicts-colors

    ### -----------------------------------------------------------------------
    ### MARK: Menu bar colors
    ### https://code.visualstudio.com/api/references/theme-color#menu-bar-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Minimap
    ### https://code.visualstudio.com/api/references/theme-color#minimap
    ###
    ### Unstyled:
    ###  - editorMinimap.inlineChatInserted
    minimap:
      background:        { light: white2 50%, dark: black0 50% }
      foregroundOpacity: *alpha50
      errorHighlight:     { light: red0 50%,    dark: red1 50% }
      warningHighlight:   { light: yellow1 50%, dark: yellow1 50% }
      findMatchHighlight: { light: blue3 50%,   dark: white1 50% }
      selectionHighlight: { light: blue3 50%,   dark: white0 50% }

    minimapGutter:
      addedBackground:    green1 50%
      deletedBackground:  red1 50%
      modifiedBackground: yellow1 50%

    minimapSlider:
      background:       { light: white2 50%, dark: black4 50% }
      activeBackground: *scrollbarSliderActiveBackground
      hoverBackground:  *scrollbarSliderHoverBackground

    ### -----------------------------------------------------------------------
    ### MARK: Notebook colors
    ### https://code.visualstudio.com/api/references/theme-color#notebook-colors

    ### -----------------------------------------------------------------------
    ### MARK: Notification colors
    ### https://code.visualstudio.com/api/references/theme-color#notification-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Panel colors
    ###
    ### Panels are shown below the editor area and contain views like Output and Integrated Terminal.
    ###
    ### https://code.visualstudio.com/api/references/theme-color#panel-colors
    panel:
      background: *background
      border: *border

    panelTitle:
      activeForeground: *foregroundAccent
      activeBorder: *borderActive
      inactiveForeground: *foregroundDim

    ### -----------------------------------------------------------------------
    ### MARK: Panel chat colors
    ### https://code.visualstudio.com/api/references/theme-color#panel-chat-colors

    ### -----------------------------------------------------------------------
    ### MARK: Peek view colors
    ### https://code.visualstudio.com/api/references/theme-color#peek-view-colors

    ### -----------------------------------------------------------------------
    ### MARK: Ports colors
    ### https://code.visualstudio.com/api/references/theme-color#ports-colors

    ### -----------------------------------------------------------------------
    ### MARK: Profiles
    ### https://code.visualstudio.com/api/references/theme-color#profiles

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Progress bar
    ### https://code.visualstudio.com/api/references/theme-color#progress-bar
    progressBar:
      background: blue3

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Quick picker colors
    ###
    ### The command palette, color theme picker, etc. By default these inherit
    ### from editorWidget settings (which includes the Find/Replace widget).
    ###
    ### https://code.visualstudio.com/api/references/theme-color#quick-picker-colors
    pickerGroup:
      foreground: *foregroundDim
      border: *border

    # quickInputList:
    #   focusBackground: *backgroundActive
    #   focusForeground: *foreground

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Scrollbar control
    ### https://code.visualstudio.com/api/references/theme-color#scrollbar-control
    scrollbar:
      shadow: { light: blue3 50%, dark: blue1 50% }

    scrollbarSlider:
      background:       { light: white0 75%, dark: black5 75% }
      activeBackground: *scrollbarSliderActiveBackground
      hoverBackground:  *scrollbarSliderHoverBackground

    ### -----------------------------------------------------------------------
    ### MARK: Settings editor colors
    ### https://code.visualstudio.com/api/references/theme-color#settings-editor-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Side bar
    ### https://code.visualstudio.com/api/references/theme-color#side-bar
    ###
    ### Unstyled:
    ###  - sideBarTitle.*
    ###  - sideBarActivityBarTop.border
    ###  - sideBarStickyScroll.*
    sideBar:
      background: *backgroundLow
      foreground: *foreground
      border:     *border
      dropBackground: *selectionBackground

    sideBarTitle.foreground: *foregroundDim

    sideBarSectionHeader:
      background: *alpha0
      border: *alpha0
      foreground: *foreground

    ### -----------------------------------------------------------------------
    ### MARK: Snippets colors
    ### https://code.visualstudio.com/api/references/theme-color#snippets-colors

    ### -----------------------------------------------------------------------
    ### MARK: Source control graph colors
    ### https://code.visualstudio.com/api/references/theme-color#source-control-graph-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Git colors
    ###
    ### Used for file labels and the SCM viewlet.
    ###
    ### https://code.visualstudio.com/api/references/theme-color#git-colors
    gitDecoration:
      addedResourceForeground:         { light: green1, dark: green2 }
      untrackedResourceForeground:     { light: green1, dark: green2 }
      modifiedResourceForeground:      { light: yellow1, dark: yellow2 }
      stageModifiedResourceForeground: { light: yellow1, dark: yellow2 }
      deletedResourceForeground:       { light: red1, dark: red2 }
      stageDeletedResourceForeground:  { light: red1, dark: red2 }
      conflictingResourceForeground:   { light: red1, dark: red2 }
      ignoredResourceForeground:       *foregroundDim

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Status bar colors
    ### https://code.visualstudio.com/api/references/theme-color#status-bar-colors
    statusBar:
      background: *buttonBackground
      foreground: *buttonForeground
      border: *alpha0
      # debuggingBackground: { light: yellow1, dark: yellow0 }
      # debuggingForeground: { light: black4,  dark: white4 }

    statusBarItem:
      activeBackground: *buttonBackgroundHover
      hoverBackground:  *buttonBackgroundHover
      # prominentBackground:      { light: blue3 50%, dark: blue2 50% }
      # prominentHoverBackground: { light: blue3,     dark: blue2 }
      # remoteBackground:      *buttonBackground
      # remoteHoverBackground: *buttonBackgroundHover
      # remoteForeground:      { light: blue1,  dark: blue3 }
      # remoteHoverForeground: { light: white5, dark: white2 }
      errorBackground: red0
      errorForeground: red2
      warningBackground: yellow0
      warningForeground: yellow2

    ### -----------------------------------------------------------------------
    ### MARK: Symbol icons colors
    ### https://code.visualstudio.com/api/references/theme-color#symbol-icons-colors

    ### -----------------------------------------------------------------------
    ### MARK: Testing colors
    ### https://code.visualstudio.com/api/references/theme-color#testing-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Text colors
    ### https://code.visualstudio.com/api/references/theme-color#text-colors
    ###
    ### Unstyled:
    ###  - textBlockQuote.*
    ###  - textCodeBlock.*
    ###  - textPreformat.*
    ###  - textSeparator.*
    textLink:
      foreground: *linkColor
      activeForeground: *linkColorActive

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Title bar colors
    ### https://code.visualstudio.com/api/references/theme-color#title-bar-colors
    titleBar:
      activeBackground: *backgroundHigh
      inactiveBackground: *backgroundLow
      activeForeground: *foreground
      inactiveForeground: *foregroundDisabled

    ### -----------------------------------------------------------------------
    ### MARK: Welcome page colors
    ### https://code.visualstudio.com/api/references/theme-color#welcome-page-colors

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Notification colors
    ### https://code.visualstudio.com/api/references/theme-color#notification-colors
    notifications:
      background: *backgroundHigh
      foreground: *foreground
      border:     *border

    notificationCenterHeader:
      background: *backgroundLow
      foreground: *foreground

    ### -----------------------------------------------------------------------
    ### ✅ MARK: Window border
    ### https://code.visualstudio.com/api/references/theme-color#window-border
    window:
      activeBorder: *borderActiveDim
      inactiveBorder: *border
